name: Production images
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: production-images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: ${{ matrix.target }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        target: [api, web]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/nooesc/personal-cloud-${{ matrix.target }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.title=Personal Cloud ${{ matrix.target }}
          cache-from: type=gha,scope=production-${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=production-${{ matrix.target }}-${{ matrix.arch }}
          provenance: true
      - name: Save image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/image-digests
          touch "/tmp/image-digests/${IMAGE_DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.target }}-${{ matrix.arch }}
          path: /tmp/image-digests/*
          retention-days: 1
  publish:
    needs: build
    strategy:
      matrix:
        target: [api, web]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: image-digest-${{ matrix.target }}-*
          path: /tmp/image-digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish version and latest multiarchitecture tags
        working-directory: /tmp/image-digests
        env:
          IMAGE_NAME: ghcr.io/nooesc/personal-cloud-${{ matrix.target }}
          IMAGE_VERSION: ${{ github.ref_name }}
        run: |
          args=()
          for digest in *; do args+=("${IMAGE_NAME}@sha256:${digest}"); done
          test "${#args[@]}" -eq 2
          docker buildx imagetools create --tag "${IMAGE_NAME}:${IMAGE_VERSION}" --tag "${IMAGE_NAME}:latest" "${args[@]}"
          docker buildx imagetools inspect "${IMAGE_NAME}:${IMAGE_VERSION}"
